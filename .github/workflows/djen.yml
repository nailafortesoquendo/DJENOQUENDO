name: Radar DJEN

# Publica a pasta site/ no GitHub Pages sempre que ela mudar.
# A coleta no DJEN NÃO roda aqui: a API do DJEN responde 403 para servidores
# fora do Brasil. Ela roda no computador do escritório (ver INSTALACAO_WINDOWS.md),
# que faz commit dos dados em site/data/ e dispara esta publicação.

on:
  push:
    branches: [Radar-de]
    paths: ["site/**", ".github/workflows/djen.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-djen-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
